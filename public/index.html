<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><title>Social Chat v6</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f7;font-family:system-ui,sans-serif;color:#171923}.app{width:min(100%,480px);min-height:100vh;margin:auto;background:#fff;padding:22px}.logo{text-align:center;font-size:28px;font-weight:900;margin:20px 0}.card{border:1px solid #e3e5eb;border-radius:18px;padding:20px;margin-bottom:16px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab{padding:11px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.tab.active{background:#4f46e5;color:#fff}.field{width:100%;padding:12px;margin-top:9px;border:1px solid #d9dce4;border-radius:11px;font:inherit}.btn{width:100%;padding:12px;margin-top:10px;border:0;border-radius:11px;background:#4f46e5;color:#fff;font-weight:800}.msg{margin-top:10px;font-size:13px}.err{color:#b91c1c}.muted{color:#737987;font-size:13px;line-height:1.5}.hidden{display:none}</style></head><body><div class="app"><div class="logo">💬 Social Chat <small style="font-size:11px">v6</small></div><div class="card"><div class="tabs"><button id="loginTab" class="tab active">Login</button><button id="signupTab" class="tab">Sign Up</button></div><div id="login"><h2>Login</h2><div class="muted">Username ya Gmail + password se database match hoga.</div><input id="li" class="field" placeholder="Username / Gmail"><input id="lp" class="field" type="password" placeholder="Password"><button id="loginBtn" class="btn">Login</button><div id="loginMsg" class="msg"></div></div><div id="signup" class="hidden"><h2>Create Account</h2><div class="muted">Account direct database me create hoga. OTP verification abhi disabled hai.</div><input id="su" class="field" maxlength="30" placeholder="Username (3-30, A-Z 0-9 _)"><input id="se" class="field" type="email" placeholder="Gmail (optional)"><input id="sp" class="field" type="password" placeholder="Password (minimum 8 characters)"><button id="signupBtn" class="btn">Create Account</button><div id="signupMsg" class="msg"></div></div></div></div><script>const $=id=>document.getElementById(id);const msg=(id,t,c='')=>{$(id).textContent=t;$(id).className='msg '+c};async function api(path,opt={}){let r;try{r=await fetch(path,{cache:'no-store',...opt})}catch{throw Error('Server se connection nahi ho raha')}const text=await r.text();let d;try{d=JSON.parse(text)}catch{throw Error('Server response invalid')}if(!r.ok)throw Error(d.error||'Request failed');return d}function show(tab){const login=tab==='login';$('login').classList.toggle('hidden',!login);$('signup').classList.toggle('hidden',login);$('loginTab').classList.toggle('active',login);$('signupTab').classList.toggle('active',!login)}$('loginTab').onclick=()=>show('login');$('signupTab').onclick=()=>show('signup');$('signupBtn').onclick=async()=>{const username=$('su').value.trim(),email=$('se').value.trim(),password=$('sp').value;if(!username||!password){msg('signupMsg','Username aur password required','err');return}try{const d=await api('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,email,password})});msg('signupMsg',d.message||'Account created. Login now.');$('li').value=username;show('login')}catch(e){msg('signupMsg',e.message,'err')}};$('loginBtn').onclick=async()=>{try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('li').value,password:$('lp').value})});location.href='/home.html'}catch(e){msg('loginMsg',e.message,'err')}};</script></body></html>
