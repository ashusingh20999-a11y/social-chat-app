<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Social Chat — Home</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#171923;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;background:#fff}
.top{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #eee;padding:15px 18px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px}.bubble{width:38px;height:38px;border-radius:12px;background:#4f46e5;color:#fff;display:grid;place-items:center}
.icon{border:0;background:#f3f4f6;border-radius:10px;padding:9px 11px;cursor:pointer}
.content{padding:18px}.welcome{background:linear-gradient(135deg,#eef2ff,#f5f3ff);border-radius:18px;padding:20px;margin-bottom:18px}
.welcome h1{margin:0 0 6px;font-size:25px}.welcome p{margin:0;color:#6b7280}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.action{border:1px solid #e5e7eb;background:#fff;border-radius:13px;padding:13px;text-align:center;font-weight:700;font-size:13px}
.section{font-size:18px;font-weight:800;margin:20px 0 12px}.card{border:1px solid #e8e8ee;border-radius:16px;padding:16px;margin-bottom:12px}.posthead{display:flex;align-items:center;gap:10px;font-weight:700}.avatar{width:40px;height:40px;border-radius:50%;background:#ddd6fe;display:grid;place-items:center;color:#4338ca;font-weight:800}.muted{color:#8a8f9d;font-size:12px}.post{margin:13px 0 0;color:#374151;line-height:1.45}.bottom{position:sticky;bottom:0;background:#fff;border-top:1px solid #eee;display:grid;grid-template-columns:repeat(4,1fr);padding:9px 4px}.nav{border:0;background:transparent;padding:8px;color:#6b7280;font-weight:700;font-size:12px}.nav.active{color:#4f46e5}@media(min-width:761px){body{padding:20px}.app{border:1px solid #e5e7eb;border-radius:20px;overflow:hidden;box-shadow:0 15px 50px rgba(0,0,0,.08)}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="logo"><span class="bubble">💬</span> Social Chat</div><button class="icon" id="logout">Logout</button></header>
<main class="content">
<section class="welcome"><h1 id="welcome">Welcome 👋</h1><p>Your social space is ready.</p>
<div class="actions"><button class="action">👤 Profile</button><button class="action">💬 Chats</button><button class="action">➕ Create</button></div></section>
<div class="section">Your feed</div>
<article class="card"><div class="posthead"><div class="avatar" id="avatar">U</div><div><div id="author">User</div><div class="muted">Just now</div></div></div><div class="post">Welcome to Social Chat! Your feed, friends and private conversations will appear here.</div></article>
<article class="card"><div class="posthead"><div class="avatar">🌐</div><div><div>Social Chat</div><div class="muted">Community</div></div></div><div class="post">Next we can add posts, likes, comments, follows and private E2EE chat.</div></article>
</main>
<nav class="bottom"><button class="nav active">⌂<br>Home</button><button class="nav">🔎<br>Search</button><button class="nav">💬<br>Messages</button><button class="nav">👤<br>Profile</button></nav>
</div>
<script>
const user=JSON.parse(sessionStorage.getItem("socialChatUser")||"null");
if(!user){location.href="/";}
else{
 const name=user.display_name||user.username||"User";
 document.getElementById("welcome").textContent="Welcome, "+name+" 👋";
 document.getElementById("author").textContent=name;
 document.getElementById("avatar").textContent=name.charAt(0).toUpperCase();
}
document.getElementById("logout").onclick=()=>{sessionStorage.removeItem("socialChatUser");location.href="/";};
</script>
</body>
</html>
