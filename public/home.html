<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><title>Social Chat - Home</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f7;font-family:system-ui,sans-serif;color:#171923}.app{width:min(100%,680px);min-height:100vh;margin:auto;padding:16px}.top{background:#fff;border:1px solid #e3e5eb;border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:21px;font-weight:900}.muted{color:#737987;font-size:13px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#4f46e5;color:#fff;font-weight:800;cursor:pointer}.danger{background:#dc2626}.card{background:#fff;border:1px solid #e3e5eb;border-radius:18px;padding:16px;margin-top:14px}.field{width:100%;padding:12px;border:1px solid #d9dce4;border-radius:11px;font:inherit;resize:vertical}.postBtn{margin-top:9px}.post{border-top:1px solid #eceef3;padding:14px 0}.post:first-child{border-top:0}.name{font-weight:800}.content{white-space:pre-wrap;margin-top:6px;line-height:1.5}.time{font-size:12px;color:#8a909d;margin-top:6px}.chat{height:320px;overflow:auto;background:#f7f8fb;border-radius:12px;padding:10px}.chatmsg{padding:7px 9px;margin:5px 0;background:#fff;border-radius:10px}.system{color:#7c3aed;font-size:12px;text-align:center;margin:7px}.chatrow{display:flex;gap:8px;margin-top:9px}.chatrow input{flex:1}.ok{color:#15803d}.err{color:#b91c1c}.lock{font-size:12px;margin:5px 0 10px;color:#15803d}.hidden{display:none}</style></head><body><main class="app"><header class="top"><div><div class="brand">💬 Social Chat</div><div id="welcome" class="muted">Checking login…</div></div><button id="logout" class="btn danger">Logout</button></header><section class="card"><h3>📝 Create Post</h3><textarea id="postText" class="field" rows="3" maxlength="2000" placeholder="What's on your mind?"></textarea><button id="postBtn" class="btn postBtn">Publish Post</button><div id="postMsg" class="muted"></div></section><section class="card"><h3>📰 Feed</h3><div id="feed" class="muted">Loading posts…</div></section><section class="card"><h3>🔐 End-to-End Encrypted Chat</h3><div class="lock">🔒 Plaintext is encrypted in your browser. The server receives only encrypted ciphertext.</div><div id="chat" class="chat"></div><div class="chatrow"><input id="chatInput" class="field" maxlength="1000" placeholder="Type an encrypted message…"><button id="sendBtn" class="btn">Send</button></div><div id="chatMsg" class="muted"></div></section></main><script>
const $=id=>document.getElementById(id);let currentUser=null,ws=null,privateKey=null,publicJwk=null,keyMap=new Map();
async function api(path,opt={}){const r=await fetch(path,{cache:'no-store',credentials:'same-origin',...opt});const text=await r.text();let d;try{d=JSON.parse(text)}catch{throw Error('Server response invalid')}if(!r.ok)throw Error(d.error||'Request failed');return d}
function escapeHtml(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function getKeys(){const d=await api('/api/chat/keys');keyMap=new Map((d.keys||[]).map(k=>[k.user_id,k]))}
async function setupCrypto(){let priv=null;try{priv=JSON.parse(localStorage.getItem('sc_e2ee_private')||'null');publicJwk=JSON.parse(localStorage.getItem('sc_e2ee_public')||'null');if(priv&&publicJwk)privateKey=await crypto.subtle.importKey('jwk',priv,{name:'ECDH',namedCurve:'P-256'},true,['deriveBits'])}catch{privateKey=null}
if(!privateKey){const pair=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']);privateKey=pair.privateKey;publicJwk=await crypto.subtle.exportKey('jwk',pair.publicKey);localStorage.setItem('sc_e2ee_private',JSON.stringify(await crypto.subtle.exportKey('jwk',privateKey)));localStorage.setItem('sc_e2ee_public',JSON.stringify(publicJwk))}
await api('/api/chat/keys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({public_key:JSON.stringify(publicJwk)})});await getKeys()}
async function makeAesKey(otherJwk){const pub=await crypto.subtle.importKey('jwk',otherJwk,{name:'ECDH',namedCurve:'P-256'},false,[]);const bits=await crypto.subtle.deriveBits({name:'ECDH',public:pub},privateKey,256);return crypto.subtle.importKey('raw',bits,{name:'AES-GCM'},false,['encrypt','decrypt'])}
async function encryptFor(text,recipient){const key=await makeAesKey(JSON.parse(recipient.public_key));const iv=crypto.getRandomValues(new Uint8Array(12));const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text));return{userId:recipient.user_id,iv:b64(iv),ciphertext:b64(data)}}
async function decryptMine(m){const mine=m.recipients.find(x=>x.userId===currentUser.id);if(!mine)return null;const key=await makeAesKey(JSON.parse(m.senderPublicKey));const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(mine.iv)},key,unb64(mine.ciphertext));return new TextDecoder().decode(data)}
async function start(){try{const d=await api('/api/me');currentUser=d.user;$('welcome').textContent=`Welcome, ${currentUser.username}`;await setupCrypto();await loadFeed();connectChat()}catch(e){location.replace('/')}}
async function loadFeed(){try{const d=await api('/api/posts');if(!d.posts.length){$('feed').textContent='No posts yet.';return}$('feed').innerHTML=d.posts.map(p=>`<article class="post"><div class="name">${escapeHtml(p.username)}</div><div class="content">${escapeHtml(p.content)}</div><div class="time">${escapeHtml(p.created_at||'')}</div></article>`).join('')}catch(e){$('feed').textContent=e.message}}
$('postBtn').onclick=async()=>{const content=$('postText').value.trim();if(!content)return;$('postBtn').disabled=true;try{await api('/api/posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})});$('postText').value='';$('postMsg').textContent='Post published ✓';await loadFeed()}catch(e){$('postMsg').textContent=e.message}finally{$('postBtn').disabled=false}};
function addChat(html,system=false){const d=document.createElement('div');d.className=system?'system':'chatmsg';d.innerHTML=html;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}
function connectChat(){const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/chat/general`);ws.onopen=()=>$('chatMsg').textContent='Connected • E2EE enabled';ws.onmessage=async e=>{try{const m=JSON.parse(e.data);if(m.type==='system'){addChat(escapeHtml(m.text),true);return}if(m.type==='encrypted'){try{const text=await decryptMine(m);if(text!==null)addChat(`<b>${escapeHtml(m.user)}</b>: ${escapeHtml(text)}`)}catch{addChat('🔒 Encrypted message could not be decrypted',true)}}}catch{}};ws.onclose=()=>$('chatMsg').textContent='Chat disconnected';ws.onerror=()=>$('chatMsg').textContent='Chat connection error'}
async function sendChat(){const text=$('chatInput').value.trim();if(!text||!ws||ws.readyState!==WebSocket.OPEN)return;$('sendBtn').disabled=true;try{await getKeys();const recipients=[];for(const k of keyMap.values()){try{recipients.push(await encryptFor(text,k))}catch{}}if(!recipients.length)throw Error('No chat keys available');ws.send(JSON.stringify({type:'encrypted',senderPublicKey:JSON.stringify(publicJwk),recipients}));$('chatInput').value=''}catch(e){$('chatMsg').textContent=e.message}finally{$('sendBtn').disabled=false}}
$('sendBtn').onclick=sendChat;$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});$('logout').onclick=async()=>{await api('/api/logout',{method:'POST'}).catch(()=>{});location.replace('/')};start();
</script></body></html>
