<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><title>Social Chat</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f7;font-family:system-ui,sans-serif;color:#171923}.app{width:min(100%,720px);margin:auto;padding:14px}.card,.top{background:#fff;border:1px solid #e2e5ec;border-radius:18px;padding:16px;margin-bottom:14px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:900}.muted{color:#727887;font-size:13px}.field{width:100%;padding:12px;border:1px solid #d7dbe5;border-radius:11px;font:inherit}.btn{border:0;border-radius:10px;padding:10px 14px;background:#4f46e5;color:#fff;font-weight:800;cursor:pointer}.danger{background:#dc2626}.row{display:flex;gap:8px}.row .field{flex:1}.person,.request{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid #eee}.person:first-child,.request:first-child{border-top:0}.actions{display:flex;gap:6px}.green{background:#16a34a}.gray{background:#6b7280}.chat{height:300px;overflow:auto;background:#f7f8fb;border-radius:12px;padding:10px}.bubble{background:#fff;padding:8px 10px;border-radius:10px;margin:6px 0}.system{text-align:center;color:#7c3aed;font-size:12px;margin:7px}.hidden{display:none}.lock{color:#15803d;font-size:12px;margin-bottom:9px}.post{border-top:1px solid #eee;padding:12px 0}.post:first-child{border-top:0}.content{white-space:pre-wrap;margin-top:5px}</style></head><body><main class="app"><header class="top"><div><div class="brand">💬 Social Chat</div><div id="welcome" class="muted">Checking login…</div></div><button id="logout" class="btn danger">Logout</button></header>
<section class="card"><h3>👥 Find People</h3><div class="row"><input id="search" class="field" placeholder="Search username"><button id="searchBtn" class="btn">Search</button></div><div id="results"></div></section>
<section class="card"><h3>🔔 Friend Requests</h3><div id="requests" class="muted">Loading…</div></section>
<section class="card"><h3>🤝 My Friends</h3><div id="friends" class="muted">Loading…</div></section>
<section id="chatCard" class="card hidden"><h3>🔐 Private E2E Chat</h3><div id="chatTitle" class="muted"></div><div class="lock">🔒 Messages are encrypted in your browser. Only the two friends can decrypt them.</div><div id="chat" class="chat"></div><div class="row" style="margin-top:9px"><input id="chatInput" class="field" maxlength="1000" placeholder="Message your friend"><button id="sendBtn" class="btn">Send</button></div><div id="chatMsg" class="muted"></div></section>
<section class="card"><h3>📝 Create Post</h3><textarea id="postText" class="field" rows="3" maxlength="2000" placeholder="What's on your mind?"></textarea><button id="postBtn" class="btn" style="margin-top:9px">Publish</button><div id="postMsg" class="muted"></div></section><section class="card"><h3>📰 Feed</h3><div id="feed" class="muted">Loading…</div></section></main>
<script>const $=id=>document.getElementById(id);let user=null,ws=null,selected=null,privateKey=null,publicJwk=null,peerKey=null;async function api(p,o={}){const r=await fetch(p,{credentials:'same-origin',cache:'no-store',...o}),t=await r.text();let d;try{d=JSON.parse(t)}catch{throw Error('Server response invalid')}if(!r.ok)throw Error(d.error||'Request failed');return d}const esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function cryptoSetup(){let a,b;try{a=JSON.parse(localStorage.getItem('sc_e2ee_private')||'null');b=JSON.parse(localStorage.getItem('sc_e2ee_public')||'null')}catch{}if(a&&b){try{privateKey=await crypto.subtle.importKey('jwk',a,{name:'ECDH',namedCurve:'P-256'},true,['deriveBits']);publicJwk=b}catch{}}if(!privateKey){const k=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']);privateKey=k.privateKey;publicJwk=await crypto.subtle.exportKey('jwk',k.publicKey);localStorage.setItem('sc_e2ee_private',JSON.stringify(await crypto.subtle.exportKey('jwk',privateKey)));localStorage.setItem('sc_e2ee_public',JSON.stringify(publicJwk))}await api('/api/chat/keys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({public_key:JSON.stringify(publicJwk)})})}
async function aes(other){const p=await crypto.subtle.importKey('jwk',JSON.parse(other),{name:'ECDH',namedCurve:'P-256'},false,[]);const bits=await crypto.subtle.deriveBits({name:'ECDH',public:p},privateKey,256);return crypto.subtle.importKey('raw',bits,{name:'AES-GCM'},false,['encrypt','decrypt'])}async function encrypt(text){const k=await aes(peerKey);const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(text));return{userId:selected.id,iv:b64(iv),ciphertext:b64(c)}}async function decrypt(m){const x=m.recipients.find(x=>x.userId===user.id);if(!x)return null;const k=await aes(m.senderPublicKey);const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(x.iv)},k,ub64(x.ciphertext));return new TextDecoder().decode(p)}
async function loadRequests(){const d=await api('/api/friends/incoming');$('requests').innerHTML=d.requests.length?d.requests.map(x=>`<div class="request"><b>${esc(x.username)}</b><span class="actions"><button class="btn green" onclick="respond('${x.id}','accept')">Accept</button><button class="btn gray" onclick="respond('${x.id}','decline')">Decline</button></span></div>`).join(''):'No pending requests.'}async function respond(id,a){await api('/api/friends/respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:id,action:a})});await loadRequests();await loadFriends()}async function loadFriends(){const d=await api('/api/friends');$('friends').innerHTML=d.friends.length?d.friends.map(x=>`<div class="person"><b>${esc(x.username)}</b><button class="btn" onclick="openChat('${esc(x.username)}','${x.id}')">Message</button></div>`).join(''):'No friends yet. Search a username and send a request.'}async function search(){const q=$('search').value.trim();if(q.length<2){$('results').textContent='Enter at least 2 characters';return}const d=await api('/api/users/search?q='+encodeURIComponent(q));$('results').innerHTML=d.users.length?d.users.map(x=>`<div class="person"><b>${esc(x.username)}</b><button class="btn" onclick="addFriend('${esc(x.username)}')">Add Friend</button></div>`).join(''):'User not found.'}async function addFriend(n){try{await api('/api/friends/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:n})});$('results').innerHTML='<div class="muted">Friend request sent ✓</div>'}catch(e){$('results').textContent=e.message}}
async function openChat(name,id){const keys=await api('/api/chat/keys');const k=keys.keys.find(x=>x.user_id===id);if(!k){$('chatMsg').textContent='Friend has not opened chat yet. Ask them to open the app once.';return}selected={id,username:name};peerKey=k.public_key;$('chatCard').classList.remove('hidden');$('chatTitle').textContent='Chat with '+name;$('chat').innerHTML='';if(ws)try{ws.close()}catch{}const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/chat/${encodeURIComponent(name)}`);ws.onopen=()=>{$('chatMsg').textContent='Connected • E2E encrypted'};ws.onmessage=async e=>{try{const m=JSON.parse(e.data);if(m.type==='encrypted'){const text=await decrypt(m);if(text!==null){const d=document.createElement('div');d.className='bubble';d.innerHTML='<b>'+esc(m.user)+'</b>: '+esc(text);$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}}}catch{}};ws.onclose=()=>{$('chatMsg').textContent='Chat disconnected'}}
$('sendBtn').onclick=async()=>{const text=$('chatInput').value.trim();if(!text||!ws||ws.readyState!==WebSocket.OPEN||!selected)return;$('sendBtn').disabled=true;try{ws.send(JSON.stringify({type:'encrypted',senderPublicKey:JSON.stringify(publicJwk),recipients:[await encrypt(text)]}));$('chatInput').value=''}catch(e){$('chatMsg').textContent=e.message}finally{$('sendBtn').disabled=false}};$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('sendBtn').click()});$('searchBtn').onclick=search;$('search').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
async function feed(){const d=await api('/api/posts');$('feed').innerHTML=d.posts.length?d.posts.map(p=>`<div class="post"><b>${esc(p.username)}</b><div class="content">${esc(p.content)}</div><small>${esc(p.created_at||'')}</small></div>`).join(''):'No posts yet.'}$('postBtn').onclick=async()=>{const c=$('postText').value.trim();if(!c)return;try{await api('/api/posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:c})});$('postText').value='';$('postMsg').textContent='Published ✓';feed()}catch(e){$('postMsg').textContent=e.message}};$('logout').onclick=async()=>{await api('/api/logout',{method:'POST'}).catch(()=>{});location.replace('/')};
(async()=>{try{const d=await api('/api/me');user=d.user;$('welcome').textContent='Welcome, '+user.username;await cryptoSetup();await loadRequests();await loadFriends();await feed()}catch{location.replace('/')}})();</script></body></html>
